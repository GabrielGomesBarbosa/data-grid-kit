<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="gridkit — a headless-first React data grid with virtualization, tree data, row grouping, pinning, editing and CSV export." />
    <title>gridkit — React data grid</title>
    <script>
      try {
        var t = localStorage.getItem('gridkit-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
