<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>data-grid-kit playground</title>
    <style>
      body { margin: 0; padding: 16px; font: 14px system-ui, sans-serif; background: #fff; color: #0f172a; }
      @media (prefers-color-scheme: dark) { body { background: #020617; color: #e2e8f0; } }
      .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
      .bar input[type='search'] { padding: 4px 8px; width: 200px; }
      .bar button, .bar select { padding: 4px 10px; cursor: pointer; }
      .bar button[aria-pressed='true'] { background: #2563eb; color: #fff; border-color: #2563eb; }
      .stat { opacity: 0.7; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
