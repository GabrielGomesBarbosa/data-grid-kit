name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A few columns and rows, the props you pass, and the steps. A link to a repository or sandbox is ideal.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: data-grid-kit version or commit
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: React version, browser and framework (Vite, Next.js...)
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Core / pipeline, Grid UI, Pivot, Server-side data, Excel / CSV export, Accessibility, SSR / Next.js, Docs, Other]
