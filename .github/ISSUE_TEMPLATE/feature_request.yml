name: Feature request
description: Suggest a capability or an improvement
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the use case before the solution.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds you tried
